<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Notes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'%3E%3Crect width='10' height='10' fill='%23377ef0'/%3E%3Crect x='10' width='10' height='10' fill='%23fed933'/%3E%3Crect x='20' width='10' height='10' fill='%23ffa7f0'/%3E%3Crect y='10' width='10' height='10' fill='%23fe6d2e'/%3E%3Crect x='10' y='10' width='10' height='10' fill='%2300ad6f'/%3E%3Crect x='20' y='10' width='10' height='10' fill='%239084f4'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-display: 'Gloock', Georgia, 'Times New Roman', serif;
            --font-ui: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif;

            --paper: #ffffff;
            --ink: #000000;
            --ink-2: #666565;
            --ink-3: #a8a8a8;

            --blue: #377ef0;
            --yellow: #fed933;
            --orange: #fe6d2e;
            --green: #00ad6f;
            --pink: #ffa7f0;
            --lilac: #9084f4;

            --hair: 1.5px;
            --ease: cubic-bezier(.84, 0, .16, 1);
        }

        [data-theme="dark"] {
            --paper: #0e0e0e;
            --ink: #f2f2f2;
            --ink-2: #a6a6a6;
            --ink-3: #6b6b6b;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-ui);
            font-size: 15px;
            line-height: 1.4;
            letter-spacing: -0.01em;
            background: var(--paper);
            color: var(--ink);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea {
            font: inherit;
            color: inherit;
            letter-spacing: inherit;
        }

        button {
            cursor: pointer;
        }

        ::selection {
            background: var(--yellow);
            color: #000;
        }

        :focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--ink-3) transparent;
        }

        .sq {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: var(--hair) solid var(--ink);
            flex-shrink: 0;
        }

        /* ===== Shell ===== */
        .app-shell {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: 100%;
        }

        .topbar,
        .drawer-backdrop {
            display: none;
        }

        /* ===== Brand box ===== */
        .brand-box {
            display: flex;
            align-items: stretch;
            height: 52px;
            border: var(--hair) solid var(--ink);
            background: var(--paper);
        }

        .brand-word {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 14px;
            font-family: var(--font-display);
            font-size: 25px;
            line-height: 1;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .brand-grid {
            display: grid;
            grid-template-columns: repeat(3, 22px);
            grid-template-rows: 1fr 1fr;
            gap: var(--hair);
            background: var(--ink);
            border-left: var(--hair) solid var(--ink);
        }

        .brand-grid i:nth-child(1) { background: var(--blue); }
        .brand-grid i:nth-child(2) { background: var(--yellow); }
        .brand-grid i:nth-child(3) { background: var(--pink); }
        .brand-grid i:nth-child(4) { background: var(--orange); }
        .brand-grid i:nth-child(5) { background: var(--green); }
        .brand-grid i:nth-child(6) { background: var(--lilac); }

        .box-btn {
            width: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-left: var(--hair) solid var(--ink);
            background: var(--paper);
            color: var(--ink);
            transition: background 0.15s;
        }

        .box-btn:hover {
            background: var(--yellow);
            color: #000;
        }

        .theme-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: var(--hair) solid currentColor;
            background: linear-gradient(90deg, currentColor 50%, transparent 50%);
        }

        .menu-icon {
            width: 20px;
            height: 11px;
            border-top: var(--hair) solid currentColor;
            border-bottom: var(--hair) solid currentColor;
        }

        /* ===== Pills ===== */
        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            padding: 0 18px;
            border: var(--hair) solid var(--ink);
            border-radius: 999px;
            background: var(--paper);
            color: var(--ink);
            font-size: 12.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s, transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }

        .pill:hover {
            background: var(--ink);
            color: var(--paper);
        }

        .pill-danger:hover {
            background: var(--orange);
            color: #000;
        }

        .pill-solid {
            color: #000;
            box-shadow: 4px 4px 0 var(--ink);
        }

        .pill-solid:hover {
            color: #000;
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0 var(--ink);
        }

        .pill-solid:active,
        .pill-solid[aria-pressed="true"] {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 var(--ink);
        }

        .pill-yellow,
        .pill-yellow:hover {
            background: var(--yellow);
        }

        .pill-blue,
        .pill-blue:hover {
            background: var(--blue);
        }

        /* ===== Sidebar ===== */
        .sidebar {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 20px 20px 16px;
            border-right: var(--hair) solid var(--ink);
            background: var(--paper);
        }

        .search {
            width: 100%;
            height: 42px;
            margin-top: 20px;
            padding: 0 18px;
            border: var(--hair) solid var(--ink);
            border-radius: 999px;
            background: var(--paper);
            font-size: 15px;
        }

        .search::placeholder {
            color: var(--ink-3);
        }

        .search:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--yellow);
        }

        .new-note {
            width: calc(100% - 4px);
            height: 46px;
            margin: 14px 0 26px;
            font-size: 13px;
        }

        .list-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 8px;
            border-bottom: var(--hair) solid var(--ink);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .notes-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 18px 8px 24px 4px;
            margin-right: -8px;
        }

        .note-card {
            display: block;
            flex-shrink: 0;
            text-align: left;
            background: var(--paper);
            color: var(--ink);
            border: var(--hair) solid var(--ink);
            padding: 12px 14px 14px;
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
        }

        .note-card:nth-child(odd) {
            margin-right: 24px;
        }

        .note-card:nth-child(even) {
            margin-left: 24px;
        }

        .note-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .note-card.active {
            background: var(--c);
            color: #000;
            border-color: #000;
        }

        .note-card > span {
            display: block;
        }

        .note-when {
            display: flex !important;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 9px;
        }

        .note-day {
            font-family: var(--font-display);
            font-size: 32px;
            line-height: 0.9;
            letter-spacing: -0.02em;
        }

        .note-mon {
            margin-top: 1px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .note-swatch {
            margin-left: auto;
            width: 12px;
            height: 12px;
            background: var(--c);
            border: var(--hair) solid var(--ink);
        }

        .note-card.active .note-swatch {
            display: none;
        }

        .note-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.015em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-preview {
            display: -webkit-box !important;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 3px;
            font-size: 13px;
            line-height: 1.4;
            color: var(--ink-2);
        }

        .note-card.active .note-preview {
            color: rgba(0, 0, 0, 0.7);
        }

        .empty-list {
            padding: 24px 4px;
            color: var(--ink-2);
            font-size: 14px;
        }

        .sidebar-foot {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 12px;
            border-top: var(--hair) solid var(--ink);
            font-size: 11.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .sidebar-foot .sq {
            background: var(--green);
        }

        /* ===== Main ===== */
        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .doc-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .doc-head {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px 20px;
            align-items: start;
            padding: 30px 40px 18px;
        }

        .doc-title {
            grid-column: 1;
            width: 100%;
            min-width: 0;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            font-family: var(--font-display);
            font-size: clamp(32px, 3.4vw, 48px);
            line-height: 1.05;
            letter-spacing: -0.015em;
        }

        .doc-title:focus-visible,
        .note-editor:focus-visible {
            outline: none;
        }

        .doc-title::placeholder {
            color: var(--ink-3);
        }

        .ai-status {
            grid-column: 2;
            grid-row: 1;
            align-self: center;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 13px;
            border: var(--hair) solid var(--ink);
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        .ai-status .sq {
            background: var(--green);
        }

        .ai-status.offline .sq {
            background: var(--orange);
        }

        .doc-meta {
            grid-column: 1 / -1;
            font-size: 13px;
            color: var(--ink-2);
        }

        .doc-bar {
            flex-shrink: 0;
            height: 12px;
            background: var(--c, var(--yellow));
            border-top: var(--hair) solid var(--ink);
            border-bottom: var(--hair) solid var(--ink);
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
        }

        .toolbar .spacer {
            flex: 1;
        }

        .doc-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 26px;
            padding: 10px 40px 32px;
        }

        .note-editor {
            flex: 1 0 auto;
            min-height: 260px;
            width: 100%;
            max-width: 760px;
            border: 0;
            outline: none;
            resize: none;
            background: transparent;
            font-size: 17px;
            line-height: 1.65;
            letter-spacing: -0.005em;
        }

        .note-editor::placeholder {
            color: var(--ink-3);
        }

        /* ===== AI panel ===== */
        .ai-panel {
            display: none;
            flex-shrink: 0;
            padding: 22px 24px 24px;
            background: var(--blue);
            color: #000;
            border: var(--hair) solid var(--ink);
        }

        .ai-panel.show {
            display: block;
            animation: rise 0.45s var(--ease);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        .ai-kicker {
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .ai-sentence {
            font-size: clamp(18px, 1.9vw, 26px);
            font-weight: 500;
            line-height: 1.6;
            letter-spacing: -0.01em;
            text-transform: uppercase;
        }

        .chip {
            display: inline-block;
            padding: 0 0.5em 0.04em;
            border: var(--hair) solid #000;
            border-radius: 999px;
            background: transparent;
            color: #000;
            font: inherit;
            line-height: 1.25;
            text-transform: inherit;
            white-space: nowrap;
            transition: background 0.15s;
        }

        .chip:hover {
            background: #fff;
        }

        .chip.running {
            background: var(--yellow);
        }

        .chip:focus-visible {
            outline-color: #000;
        }

        .ai-response {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 16px 18px;
            background: #fff;
            color: #000;
            border: var(--hair) solid #000;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .ai-response:empty {
            display: none;
        }

        /* ===== Empty state ===== */
        .empty-state {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 40px;
        }

        .empty-state.show {
            display: flex;
        }

        .empty-state h2 {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: clamp(40px, 5vw, 64px);
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .empty-state p {
            max-width: 36ch;
            margin: 12px 0 24px;
            color: var(--ink-2);
            font-size: 16px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: min(360px, calc(100vw - 40px));
            padding: 12px 16px 12px 14px;
            background: var(--paper);
            color: var(--ink);
            border: var(--hair) solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font-size: 14px;
            transform: translateY(-160%);
            transition: transform 0.4s var(--ease);
        }

        .toast.show {
            transform: none;
        }

        .toast .sq {
            background: var(--green);
        }

        .toast.error .sq {
            background: var(--orange);
        }

        @media (hover: none) {
            .box-btn:hover {
                background: var(--paper);
                color: var(--ink);
            }

            .note-card:hover {
                transform: none;
                box-shadow: none;
            }

            .pill:not(.pill-solid):hover {
                background: var(--paper);
                color: var(--ink);
            }

            .pill-solid:hover:not([aria-pressed="true"]) {
                transform: none;
                box-shadow: 4px 4px 0 var(--ink);
            }
        }

        /* ===== Reduced motion ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 860px) {
            .app-shell {
                grid-template-columns: 1fr;
                height: calc(100% - 68px);
                margin-top: 68px;
            }

            .topbar {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 30;
                padding: 8px 12px;
                background: var(--paper);
            }

            .brand-word {
                font-size: 22px;
            }

            .brand-grid {
                grid-template-columns: repeat(3, 18px);
            }

            .box-btn {
                width: 48px;
            }

            .sidebar .brand-box {
                display: none;
            }

            .sidebar .search {
                margin-top: 0;
            }

            .sidebar {
                position: fixed;
                top: 68px;
                bottom: 0;
                left: 0;
                z-index: 25;
                width: min(340px, 88vw);
                border-top: var(--hair) solid var(--ink);
                transform: translateX(-102%);
                transition: transform 0.5s var(--ease);
            }

            .sidebar.open {
                transform: none;
            }

            .drawer-backdrop {
                display: block;
                position: fixed;
                inset: 68px 0 0 0;
                z-index: 20;
                background: rgba(0, 0, 0, 0.35);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s;
            }

            .drawer-backdrop.show {
                opacity: 1;
                pointer-events: auto;
            }

            .doc-head {
                padding: 20px 18px 14px;
            }

            .toolbar {
                padding: 14px 18px;
            }

            .doc-body {
                padding: 6px 18px 24px;
            }

            .note-editor {
                font-size: 16px;
            }

            .ai-panel {
                padding: 18px;
            }

            .empty-state {
                padding: 24px 18px;
            }
        }

        @media (max-width: 400px) {
            .pill {
                padding: 0 14px;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="topbar">
        <div class="brand-box">
            <div class="brand-word">AI Notes.</div>
            <div class="brand-grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <button class="box-btn" id="themeToggleMobile" aria-label="Switch light or dark theme"><span class="theme-icon"></span></button>
            <button class="box-btn" id="drawerToggle" aria-label="Show notes" aria-expanded="false"><span class="menu-icon"></span></button>
        </div>
    </div>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand-box">
                <div class="brand-word">AI Notes.</div>
                <div class="brand-grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                <button class="box-btn" id="themeToggle" aria-label="Switch light or dark theme"><span class="theme-icon"></span></button>
            </div>

            <input type="search" class="search" placeholder="Search notes" id="searchInput" aria-label="Search notes">

            <button class="pill pill-solid pill-yellow new-note" id="newNoteBtn">New note</button>

            <div class="list-head"><span>All notes</span><span id="noteCount">0</span></div>

            <div class="notes-list" id="notesList"></div>

            <div class="sidebar-foot"><span class="sq"></span>Saved on this device</div>
        </aside>

        <main class="main">
            <div class="doc-view" id="docView">
                <header class="doc-head">
                    <input type="text" class="doc-title" id="noteTitleInput" placeholder="Untitled note" aria-label="Note title">
                    <div class="ai-status" id="aiStatus"><span class="sq"></span><span id="aiStatusLabel">Checking AI…</span></div>
                    <div class="doc-meta" id="docMeta"></div>
                </header>

                <div class="doc-bar"></div>

                <div class="toolbar">
                    <button class="pill" id="saveBtn">Save</button>
                    <button class="pill pill-danger" id="deleteBtn">Delete</button>
                    <span class="spacer"></span>
                    <button class="pill pill-solid pill-blue" id="aiBtn" aria-pressed="false" aria-controls="aiPanel">Ask AI</button>
                </div>

                <div class="doc-body">
                    <textarea class="note-editor" id="noteEditor" placeholder="Start writing…" aria-label="Note text"></textarea>

                    <section class="ai-panel" id="aiPanel" aria-label="AI assistant">
                        <div class="ai-kicker">DeepSeek R1 · runs on your machine</div>
                        <p class="ai-sentence">
                            Read this note and
                            <button class="chip" data-action="summarize">summarize it</button>,
                            <button class="chip" data-action="improve">improve the writing</button>,
                            <button class="chip" data-action="expand">expand the ideas</button>,
                            <button class="chip" data-action="questions">ask me questions</button>
                            or <button class="chip" data-action="keywords">pull out keywords</button>.
                        </p>
                        <div class="ai-response" id="aiResponse" aria-live="polite"></div>
                    </section>
                </div>
            </div>

            <div class="empty-state" id="emptyState">
                <h2>Nothing open.</h2>
                <p>Pick a note from the list, or start a new one.</p>
                <button class="pill pill-solid pill-yellow" id="emptyNewBtn">New note</button>
            </div>
        </main>
    </div>

    <script>
        const NOTE_COLORS = ['blue', 'yellow', 'pink', 'green', 'orange', 'lilac'];
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        function colorFor(id) {
            let h = 0;
            for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
            return `var(--${NOTE_COLORS[h % NOTE_COLORS.length]})`;
        }

        class AINotesApp {
            constructor() {
                this.notes = this.loadNotes();
                this.currentNote = null;
                this.isAIConnected = false;
                this.theme = this.loadTheme();
                this.init();
            }

            init() {
                this.applyTheme();
                this.bindEvents();
                this.checkAIConnection();
                this.loadDefaultNote();
            }

            loadTheme() {
                return localStorage.getItem('ai-notes-theme') || 'light';
            }

            saveTheme() {
                localStorage.setItem('ai-notes-theme', this.theme);
            }

            applyTheme() {
                document.body.setAttribute('data-theme', this.theme);
            }

            toggleTheme() {
                this.theme = this.theme === 'light' ? 'dark' : 'light';
                this.applyTheme();
                this.saveTheme();
            }

            loadDefaultNote() {
                if (this.notes.length === 0) {
                    const defaultNote = {
                        id: '1',
                        title: 'Ferrari',
                        content: `Ferrari, the iconic Italian sports car manufacturer, is synonymous with luxury, speed, and racing heritage. Founded by Enzo Ferrari in 1939, the company initially focused on racing before expanding into the production of high-performance road cars. Ferrari's history is deeply intertwined with Formula 1, where Scuderia Ferrari is the most successful team, boasting numerous championships and a passionate fanbase. Beyond racing, Ferrari cars are known for their distinctive design, advanced technology, and the emotional connection they evoke. Each Ferrari represents a blend of artistry and engineering, making them coveted symbols of automotive excellence and a source of enduring fascination.`,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    };

                    this.notes = [defaultNote];
                    this.saveNotes();
                }

                this.currentNote = this.notes[0];
                this.renderNotesList();
                this.loadNoteInEditor(this.currentNote);
            }

            bindEvents() {
                document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());
                document.getElementById('themeToggleMobile').addEventListener('click', () => this.toggleTheme());

                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('emptyNewBtn').addEventListener('click', () => this.createNewNote());

                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchNotes(e.target.value);
                });

                document.getElementById('saveBtn').addEventListener('click', () => this.saveCurrentNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteCurrentNote());
                document.getElementById('aiBtn').addEventListener('click', () => this.toggleAIPanel());

                document.querySelectorAll('.chip').forEach(chip => {
                    chip.addEventListener('click', (e) => {
                        this.processAIRequest(e.currentTarget.dataset.action, e.currentTarget);
                    });
                });

                document.getElementById('noteEditor').addEventListener('input', () => {
                    this.updateMeta();
                    this.autoSave();
                });

                document.getElementById('noteTitleInput').addEventListener('input', () => this.autoSave());

                document.getElementById('notesList').addEventListener('click', (e) => {
                    const card = e.target.closest('.note-card');
                    if (card) this.selectNote(card.dataset.id);
                });

                document.getElementById('drawerToggle').addEventListener('click', () => this.toggleDrawer());
                document.getElementById('drawerBackdrop').addEventListener('click', () => this.closeDrawer());

                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key) {
                            case 's':
                                e.preventDefault();
                                this.saveCurrentNote();
                                break;
                            case 'n':
                                e.preventDefault();
                                this.createNewNote();
                                break;
                            case 'd':
                                e.preventDefault();
                                this.toggleTheme();
                                break;
                        }
                    }
                });
            }

            toggleDrawer() {
                if (document.getElementById('sidebar').classList.contains('open')) {
                    this.closeDrawer();
                } else {
                    this.openDrawer();
                }
            }

            openDrawer() {
                document.getElementById('sidebar').classList.add('open');
                document.getElementById('drawerBackdrop').classList.add('show');
                document.getElementById('drawerToggle').setAttribute('aria-expanded', 'true');
            }

            closeDrawer() {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('drawerBackdrop').classList.remove('show');
                document.getElementById('drawerToggle').setAttribute('aria-expanded', 'false');
            }

            isMobile() {
                return window.innerWidth <= 860;
            }

            loadNotes() {
                try {
                    const notes = localStorage.getItem('ai-notes');
                    return notes ? JSON.parse(notes) : [];
                } catch (error) {
                    console.error('Error loading notes:', error);
                    return [];
                }
            }

            saveNotes() {
                try {
                    localStorage.setItem('ai-notes', JSON.stringify(this.notes));
                } catch (error) {
                    console.error('Error saving notes:', error);
                    this.showToast('Couldn’t save. Your browser storage may be full.', 'error');
                }
            }

            createNewNote() {
                const newNote = {
                    id: Date.now().toString(),
                    title: 'Untitled note',
                    content: '',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                this.notes.unshift(newNote);
                this.currentNote = newNote;
                this.saveNotes();
                this.renderNotesList();
                this.loadNoteInEditor(newNote);
                if (this.isMobile()) this.closeDrawer();

                const titleInput = document.getElementById('noteTitleInput');
                titleInput.focus();
                titleInput.select();
            }

            selectNote(noteId) {
                const note = this.notes.find(n => n.id === noteId);
                if (note) {
                    this.currentNote = note;
                    this.loadNoteInEditor(note);
                    this.renderNotesList(this.filteredNotes());
                    if (this.isMobile()) this.closeDrawer();
                }
            }

            loadNoteInEditor(note) {
                const docView = document.getElementById('docView');
                const emptyState = document.getElementById('emptyState');

                if (!note) {
                    docView.style.display = 'none';
                    emptyState.classList.add('show');
                    return;
                }

                docView.style.display = '';
                emptyState.classList.remove('show');
                docView.style.setProperty('--c', colorFor(note.id));

                document.getElementById('noteTitleInput').value = note.title;
                document.getElementById('noteEditor').value = note.content;
                document.getElementById('aiResponse').textContent = '';
                this.updateMeta();
                this.hideAIPanel();
            }

            updateMeta() {
                if (!this.currentNote) return;
                const text = document.getElementById('noteEditor').value.trim();
                const words = text ? text.split(/\s+/).length : 0;
                document.getElementById('docMeta').textContent =
                    `${this.formatEdited(this.currentNote.updatedAt)} · ${words} ${words === 1 ? 'word' : 'words'}`;
            }

            saveCurrentNote(silent = false) {
                if (!this.currentNote) return;

                this.currentNote.title = document.getElementById('noteTitleInput').value.trim() || 'Untitled note';
                this.currentNote.content = document.getElementById('noteEditor').value;
                this.currentNote.updatedAt = new Date().toISOString();

                this.saveNotes();
                this.renderNotesList(this.filteredNotes());
                this.updateMeta();
                if (!silent) this.showToast('Saved');
            }

            autoSave() {
                if (this.currentNote) {
                    clearTimeout(this.autoSaveTimeout);
                    this.autoSaveTimeout = setTimeout(() => this.saveCurrentNote(true), 1000);
                }
            }

            deleteCurrentNote() {
                if (!this.currentNote) return;

                if (confirm('Delete this note? This can’t be undone.')) {
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.currentNote = this.notes.length > 0 ? this.notes[0] : null;
                    this.saveNotes();
                    this.renderNotesList(this.filteredNotes());
                    this.loadNoteInEditor(this.currentNote);
                    this.showToast('Note deleted');
                }
            }

            filteredNotes() {
                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                if (!query) return this.notes;
                return this.notes.filter(note =>
                    note.title.toLowerCase().includes(query) ||
                    note.content.toLowerCase().includes(query)
                );
            }

            searchNotes() {
                this.renderNotesList(this.filteredNotes());
            }

            renderNotesList(notesToRender = this.notes) {
                const notesList = document.getElementById('notesList');
                document.getElementById('noteCount').textContent = this.notes.length;

                if (notesToRender.length === 0) {
                    const searching = document.getElementById('searchInput').value.trim();
                    notesList.innerHTML = `<div class="empty-list">${searching ? 'No notes match your search.' : 'No notes yet. Start one above.'}</div>`;
                    return;
                }

                notesList.innerHTML = notesToRender.map(note => {
                    const isActive = this.currentNote?.id === note.id;
                    const d = new Date(note.updatedAt);
                    const preview = note.content.trim() ? note.content.substring(0, 120) : 'Empty note';
                    return `
                    <button type="button" class="note-card${isActive ? ' active' : ''}" data-id="${this.escapeHtml(note.id)}"
                            style="--c: ${colorFor(note.id)}" ${isActive ? 'aria-current="true"' : ''}>
                        <span class="note-when">
                            <span class="note-day">${d.getDate()}</span>
                            <span class="note-mon">${MONTHS[d.getMonth()]}</span>
                            <span class="note-swatch"></span>
                        </span>
                        <span class="note-title">${this.escapeHtml(note.title)}</span>
                        <span class="note-preview">${this.escapeHtml(preview)}</span>
                    </button>`;
                }).join('');
            }

            toggleAIPanel() {
                const aiPanel = document.getElementById('aiPanel');
                const open = aiPanel.classList.toggle('show');
                document.getElementById('aiBtn').setAttribute('aria-pressed', String(open));

                if (open && !this.isAIConnected) {
                    this.showToast('AI is offline. Start Ollama with deepseek-r1:1.5b, then reload.', 'error');
                }
            }

            hideAIPanel() {
                document.getElementById('aiPanel').classList.remove('show');
                document.getElementById('aiBtn').setAttribute('aria-pressed', 'false');
            }

            async checkAIConnection() {
                try {
                    const response = await fetch('http://localhost:11434/api/tags');
                    if (response.ok) {
                        const data = await response.json();
                        const hasDeepSeek = data.models?.some(model =>
                            model.name.includes('deepseek-r1:1.5b')
                        );

                        this.isAIConnected = hasDeepSeek;
                        this.updateAIStatus(hasDeepSeek);
                    } else {
                        this.updateAIStatus(false);
                    }
                } catch (error) {
                    this.isAIConnected = false;
                    this.updateAIStatus(false);
                }
            }

            updateAIStatus(connected) {
                document.getElementById('aiStatus').classList.toggle('offline', !connected);
                document.getElementById('aiStatusLabel').textContent = connected ? 'DeepSeek R1 ready' : 'AI offline';
            }

            async processAIRequest(action, chip) {
                if (!this.isAIConnected) {
                    this.showToast('AI is offline. Start Ollama with deepseek-r1:1.5b, then reload.', 'error');
                    return;
                }

                const content = document.getElementById('noteEditor').value;
                if (!content.trim()) {
                    this.showToast('Write something first, then ask the AI.', 'error');
                    return;
                }

                const aiResponse = document.getElementById('aiResponse');
                chip.classList.add('running');
                aiResponse.textContent = 'Working on it…';

                try {
                    const prompt = this.generatePrompt(action, content);
                    const response = await this.callOllama(prompt);
                    const answer = (response || '').replace(/<think>[\s\S]*?<\/think>/g, '').trim();
                    aiResponse.textContent = answer || 'The model returned an empty answer. Try again.';
                } catch (error) {
                    console.error('AI request failed:', error);
                    aiResponse.textContent = 'The model didn’t respond. Check that Ollama is running, then try again.';
                    this.showToast('AI request failed', 'error');
                } finally {
                    chip.classList.remove('running');
                }
            }

            generatePrompt(action, content) {
                const prompts = {
                    summarize: `Please provide a concise summary of the following text:\n\n${content}`,
                    improve: `Please improve the writing quality, clarity, and flow of this text while maintaining its original meaning:\n\n${content}`,
                    expand: `Please expand on the ideas in this text, adding more details, examples, and insights:\n\n${content}`,
                    questions: `Based on this text, generate 5 thoughtful questions that could help explore the topic deeper:\n\n${content}`,
                    keywords: `Extract the main keywords and key concepts from this text:\n\n${content}`
                };

                return prompts[action] || content;
            }

            async callOllama(prompt) {
                const response = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'deepseek-r1:1.5b',
                        prompt: prompt,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data.response;
            }

            showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.setAttribute('role', 'status');
                const mark = document.createElement('span');
                mark.className = 'sq';
                const text = document.createElement('span');
                text.textContent = message;
                toast.append(mark, text);
                document.body.appendChild(toast);

                setTimeout(() => toast.classList.add('show'), 50);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }

            formatEdited(dateString) {
                const date = new Date(dateString);
                const startOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
                const days = Math.round((startOf(new Date()) - startOf(date)) / 86400000);

                if (days <= 0) return 'Edited today';
                if (days === 1) return 'Edited yesterday';
                if (days < 7) return `Edited ${days} days ago`;
                return `Edited ${date.getDate()} ${MONTHS[date.getMonth()]}`;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        const app = new AINotesApp();
    </script>
</body>
</html>
