<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Notes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'%3E%3Crect width='10' height='10' fill='%23377ef0'/%3E%3Crect x='10' width='10' height='10' fill='%23fed933'/%3E%3Crect x='20' width='10' height='10' fill='%23ffa7f0'/%3E%3Crect y='10' width='10' height='10' fill='%23fe6d2e'/%3E%3Crect x='10' y='10' width='10' height='10' fill='%2300ad6f'/%3E%3Crect x='20' y='10' width='10' height='10' fill='%239084f4'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Schibsted+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-display: 'Gloock', Georgia, 'Times New Roman', serif;
            --font-ui: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif;

            --paper: #ffffff;
            --ink: #000000;
            --ink-2: #666565;
            --ink-3: #b3b3b3;

            --blue: #377ef0;
            --yellow: #fed933;
            --orange: #fe6d2e;
            --green: #00ad6f;
            --pink: #ffa7f0;
            --lilac: #9084f4;

            --hair: 1.5px;
            --ease: cubic-bezier(.84, 0, .16, 1);
        }

        [data-theme="dark"] {
            --paper: #0e0e0e;
            --ink: #f2f2f2;
            --ink-2: #a6a6a6;
            --ink-3: #5c5c5c;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-ui);
            font-size: 15px;
            line-height: 1.4;
            letter-spacing: -0.01em;
            background: var(--paper);
            color: var(--ink);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea {
            font: inherit;
            color: inherit;
            letter-spacing: inherit;
        }

        button {
            cursor: pointer;
        }

        ::selection {
            background: var(--yellow);
            color: #000;
        }

        :focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--ink-3) transparent;
        }

        .sq {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: var(--hair) solid var(--ink);
            flex-shrink: 0;
        }

        body[data-view="index"] .note-view,
        body[data-view="note"] .index-view {
            display: none;
        }

        /* ===== Shared controls ===== */
        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            padding: 0 18px;
            border: var(--hair) solid var(--ink);
            border-radius: 999px;
            background: var(--paper);
            color: var(--ink);
            font-size: 12.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s, transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }

        .pill:hover {
            background: var(--ink);
            color: var(--paper);
        }

        .pill-danger:hover {
            background: var(--orange);
            color: #000;
        }

        .pill-new {
            background: var(--yellow);
            color: #000;
            box-shadow: 4px 4px 0 var(--ink);
        }

        .pill-new:hover {
            background: var(--yellow);
            color: #000;
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0 var(--ink);
        }

        .pill-new:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 var(--ink);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border: var(--hair) solid var(--ink);
            border-radius: 50%;
            background: var(--paper);
            color: var(--ink);
            transition: background 0.15s;
        }

        .icon-btn:hover {
            background: var(--yellow);
            color: #000;
        }

        .theme-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: var(--hair) solid currentColor;
            background: linear-gradient(90deg, currentColor 50%, transparent 50%);
        }

        /* ===== Index view ===== */
        .index-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 32px;
        }

        .bar .spacer {
            flex: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-display);
            font-size: 26px;
            line-height: 1;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(3, 13px);
            grid-template-rows: repeat(2, 13px);
            gap: var(--hair);
            background: var(--ink);
            border: var(--hair) solid var(--ink);
        }

        .logo-grid i:nth-child(1) { background: var(--blue); }
        .logo-grid i:nth-child(2) { background: var(--yellow); }
        .logo-grid i:nth-child(3) { background: var(--pink); }
        .logo-grid i:nth-child(4) { background: var(--orange); }
        .logo-grid i:nth-child(5) { background: var(--green); }
        .logo-grid i:nth-child(6) { background: var(--lilac); }

        .search-wrap {
            display: flex;
            justify-content: center;
            padding: 12px 32px 0;
        }

        .search {
            width: min(420px, 100%);
            height: 42px;
            padding: 0 20px;
            border: var(--hair) solid var(--ink);
            border-radius: 999px;
            background: var(--paper);
            font-size: 15px;
            text-align: center;
        }

        .search::placeholder {
            color: var(--ink-3);
        }

        .search:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--yellow);
        }

        .index-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding: 48px 32px 56px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr minmax(0, auto) 1fr;
            align-items: center;
            gap: 0 22px;
            width: 100%;
            padding: 0;
            border: 0;
            background: none;
            color: var(--ink);
            text-align: center;
            animation: rowIn 0.6s var(--ease) both;
        }

        .row:focus-visible {
            outline: none;
        }

        .row-title {
            grid-column: 2;
            grid-row: 1;
            max-width: 1200px;
            padding: 0.03em 0.14em 0.05em;
            font-size: clamp(38px, 6vw, 96px);
            font-weight: 800;
            line-height: 0.92;
            letter-spacing: -0.035em;
            text-transform: uppercase;
            overflow-wrap: anywhere;
            transition: background 0.2s, color 0.2s;
        }

        .row:hover .row-title,
        .row:focus-visible .row-title {
            background: var(--c);
            color: #000;
        }

        .row-note {
            grid-row: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-size: 16px;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .row:nth-child(odd) .row-note {
            grid-column: 1;
            justify-self: end;
        }

        .row:nth-child(even) .row-note {
            grid-column: 3;
            justify-self: start;
        }

        .row-note .sq {
            background: var(--c);
        }

        @keyframes rowIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: none; }
        }

        .index-empty {
            text-align: center;
            font-size: clamp(38px, 6vw, 96px);
            font-weight: 800;
            line-height: 0.92;
            letter-spacing: -0.035em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        .index-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px 32px 22px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .index-foot span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .index-foot .sq {
            background: var(--green);
        }

        /* ===== Note view ===== */
        .note-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            animation: viewIn 0.5s var(--ease);
        }

        @keyframes viewIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: none; }
        }

        .note-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            border-bottom: var(--hair) solid var(--ink);
        }

        .note-bar .spacer {
            flex: 1;
        }

        .note-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 56px 32px 280px;
        }

        .note-col {
            max-width: 700px;
            margin: 0 auto;
        }

        .note-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--ink-2);
        }

        .note-meta .sq {
            background: var(--c);
        }

        .doc-title {
            display: block;
            width: 100%;
            margin: 14px 0 22px;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            font-family: var(--font-display);
            font-size: clamp(40px, 6vw, 76px);
            line-height: 1.02;
            letter-spacing: -0.02em;
        }

        .doc-title::placeholder,
        .note-editor::placeholder {
            color: var(--ink-3);
        }

        .doc-bar {
            height: 12px;
            margin-bottom: 34px;
            background: var(--c);
            border: var(--hair) solid var(--ink);
        }

        .note-editor {
            display: block;
            width: 100%;
            min-height: 40vh;
            overflow: hidden;
            border: 0;
            outline: none;
            resize: none;
            background: transparent;
            font-size: 18px;
            line-height: 1.7;
            letter-spacing: -0.005em;
        }

        .doc-title:focus-visible,
        .note-editor:focus-visible {
            outline: none;
        }

        /* ===== AI dock ===== */
        .dock {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 20;
            width: min(1120px, calc(100% - 48px));
            transform: translateX(-50%);
            background: var(--blue);
            color: #000;
            border: var(--hair) solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .dock-answer {
            display: none;
            border-bottom: var(--hair) solid #000;
            background: #fff;
        }

        .dock.has-answer .dock-answer {
            display: block;
        }

        .dock-answer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px 0 20px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .dock-clear {
            height: 30px;
            padding: 0 12px;
            border: var(--hair) solid #000;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font-size: 11.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .dock-clear:hover {
            background: #000;
            color: #fff;
        }

        .dock-answer-text {
            max-height: 36vh;
            overflow-y: auto;
            padding: 10px 20px 18px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .dock-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px 14px 20px;
        }

        .dock-label {
            font-family: var(--font-display);
            font-size: 21px;
            line-height: 1.1;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .dock-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            height: 34px;
            padding: 0 14px;
            border: var(--hair) solid #000;
            border-radius: 999px;
            background: transparent;
            color: #000;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
            transition: background 0.15s, opacity 0.15s;
        }

        .chip:hover {
            background: #fff;
        }

        .chip.running {
            background: var(--yellow);
        }

        .chip:focus-visible {
            outline-color: #000;
        }

        .dock.offline .chip {
            opacity: 0.5;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: min(360px, calc(100vw - 40px));
            padding: 12px 16px 12px 14px;
            background: var(--paper);
            color: var(--ink);
            border: var(--hair) solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            font-size: 14px;
            transform: translateY(-160%);
            transition: transform 0.4s var(--ease);
        }

        .toast.show {
            transform: none;
        }

        .toast .sq {
            background: var(--green);
        }

        .toast.error .sq {
            background: var(--orange);
        }

        @media (hover: none) {
            .icon-btn:hover,
            .pill:not(.pill-new):hover {
                background: var(--paper);
                color: var(--ink);
            }

            .pill-new:hover {
                transform: none;
                box-shadow: 4px 4px 0 var(--ink);
            }

            .row:hover .row-title {
                background: none;
                color: var(--ink);
            }

            .chip:hover {
                background: transparent;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        /* ===== Small screens ===== */
        @media (max-width: 720px) {
            .bar {
                padding: 14px 16px;
                gap: 10px;
            }

            .logo {
                font-size: 22px;
                gap: 10px;
            }

            .logo-grid {
                grid-template-columns: repeat(3, 10px);
                grid-template-rows: repeat(2, 10px);
            }

            .pill {
                height: 38px;
                padding: 0 14px;
            }

            .search-wrap {
                padding: 8px 16px 0;
            }

            .index-list {
                gap: 22px;
                padding: 36px 16px 40px;
            }

            .row {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            .row-note {
                order: -1;
                font-size: 14px;
            }

            .index-foot {
                padding: 14px 16px 18px;
                font-size: 11px;
            }

            .note-bar {
                padding: 12px 16px;
            }

            .back-long {
                display: none;
            }

            .note-scroll {
                padding: 32px 18px 320px;
            }

            .note-editor {
                font-size: 17px;
            }

            .dock {
                bottom: 12px;
                width: calc(100% - 28px);
                box-shadow: 4px 4px 0 var(--ink);
            }

            .dock-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 12px 0 14px 14px;
            }

            .dock-label {
                font-size: 18px;
                white-space: normal;
                padding-right: 14px;
            }

            .dock-actions {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-right: 14px;
                scrollbar-width: none;
            }

            .dock-actions::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
</head>
<body data-theme="light" data-view="index">
    <section class="index-view" aria-label="All notes">
        <header class="bar">
            <div class="logo"><span class="logo-grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>AI Notes.</div>
            <span class="spacer"></span>
            <button class="icon-btn" id="themeToggle" aria-label="Switch light or dark theme"><span class="theme-icon"></span></button>
            <button class="pill pill-new" id="newNoteBtn">New note</button>
        </header>

        <div class="search-wrap">
            <input type="search" class="search" id="searchInput" placeholder="Search notes" aria-label="Search notes">
        </div>

        <nav class="index-list" id="notesList" aria-label="Notes"></nav>

        <footer class="index-foot">
            <span id="noteCount">0 notes</span>
            <span><span class="sq"></span>Saved on this device</span>
        </footer>
    </section>

    <section class="note-view" id="noteView" aria-label="Note">
        <header class="note-bar">
            <button class="pill" id="backBtn"><span aria-hidden="true">←</span><span><span class="back-long">All </span>notes</span></button>
            <span class="spacer"></span>
            <button class="pill" id="saveBtn">Save</button>
            <button class="pill pill-danger" id="deleteBtn">Delete</button>
        </header>

        <div class="note-scroll" id="noteScroll">
            <article class="note-col">
                <div class="note-meta"><span class="sq"></span><span id="docMeta"></span></div>
                <input type="text" class="doc-title" id="noteTitleInput" placeholder="Untitled note" aria-label="Note title">
                <div class="doc-bar"></div>
                <textarea class="note-editor" id="noteEditor" placeholder="Start writing…" aria-label="Note text"></textarea>
            </article>
        </div>

        <div class="dock" id="aiDock" aria-label="AI assistant">
            <div class="dock-answer">
                <div class="dock-answer-head">
                    <span id="aiAnswerLabel">Answer</span>
                    <button class="dock-clear" id="aiClear">Clear</button>
                </div>
                <div class="dock-answer-text" id="aiResponse" aria-live="polite"></div>
            </div>
            <div class="dock-row">
                <span class="dock-label" id="aiDockLabel">Checking for DeepSeek R1…</span>
                <div class="dock-actions">
                    <button class="chip" data-action="summarize">Summarize</button>
                    <button class="chip" data-action="improve">Improve writing</button>
                    <button class="chip" data-action="expand">Expand ideas</button>
                    <button class="chip" data-action="questions">Ask me questions</button>
                    <button class="chip" data-action="keywords">Pull out keywords</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        const NOTE_COLORS = ['blue', 'yellow', 'pink', 'green', 'orange', 'lilac'];
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const ANSWER_LABELS = {
            summarize: 'Summary',
            improve: 'Improved writing',
            expand: 'Expanded ideas',
            questions: 'Questions to explore',
            keywords: 'Keywords'
        };

        function colorFor(id) {
            let h = 0;
            for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
            return `var(--${NOTE_COLORS[h % NOTE_COLORS.length]})`;
        }

        class AINotesApp {
            constructor() {
                this.notes = this.loadNotes();
                this.currentNote = null;
                this.isAIConnected = false;
                this.theme = this.loadTheme();
                this.init();
            }

            init() {
                this.applyTheme();

                if (this.notes.length === 0) {
                    this.notes = [{
                        id: '1',
                        title: 'Ferrari',
                        content: `Ferrari, the iconic Italian sports car manufacturer, is synonymous with luxury, speed, and racing heritage. Founded by Enzo Ferrari in 1939, the company initially focused on racing before expanding into the production of high-performance road cars. Ferrari's history is deeply intertwined with Formula 1, where Scuderia Ferrari is the most successful team, boasting numerous championships and a passionate fanbase. Beyond racing, Ferrari cars are known for their distinctive design, advanced technology, and the emotional connection they evoke. Each Ferrari represents a blend of artistry and engineering, making them coveted symbols of automotive excellence and a source of enduring fascination.`,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    }];
                    this.saveNotes();
                }

                this.bindEvents();
                this.checkAIConnection();
                this.route();
            }

            loadTheme() {
                return localStorage.getItem('ai-notes-theme') || 'light';
            }

            saveTheme() {
                localStorage.setItem('ai-notes-theme', this.theme);
            }

            applyTheme() {
                document.body.setAttribute('data-theme', this.theme);
            }

            toggleTheme() {
                this.theme = this.theme === 'light' ? 'dark' : 'light';
                this.applyTheme();
                this.saveTheme();
            }

            bindEvents() {
                window.addEventListener('hashchange', () => {
                    this.flushSave();
                    this.route();
                });

                document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('searchInput').addEventListener('input', () => this.renderIndex());

                document.getElementById('notesList').addEventListener('click', (e) => {
                    const row = e.target.closest('.row');
                    if (row) this.openNote(row.dataset.id);
                });

                document.getElementById('backBtn').addEventListener('click', () => this.goIndex());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveCurrentNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteCurrentNote());

                const editor = document.getElementById('noteEditor');
                editor.addEventListener('input', () => {
                    this.autosize();
                    this.updateMeta();
                    this.autoSave();
                });
                document.getElementById('noteTitleInput').addEventListener('input', () => this.autoSave());

                document.querySelectorAll('.chip').forEach(chip => {
                    chip.addEventListener('click', (e) => {
                        this.processAIRequest(e.currentTarget.dataset.action, e.currentTarget);
                    });
                });
                document.getElementById('aiClear').addEventListener('click', () => this.clearAnswer());

                window.addEventListener('resize', () => this.autosize());

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && document.body.dataset.view === 'note') {
                        this.goIndex();
                        return;
                    }
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key) {
                            case 's':
                                e.preventDefault();
                                this.saveCurrentNote();
                                break;
                            case 'n':
                                e.preventDefault();
                                this.createNewNote();
                                break;
                            case 'd':
                                e.preventDefault();
                                this.toggleTheme();
                                break;
                        }
                    }
                });
            }

            route() {
                const id = decodeURIComponent(location.hash.slice(1));
                const note = this.notes.find(n => n.id === id);
                if (note) {
                    this.showNote(note);
                } else {
                    this.showIndex();
                }
            }

            openNote(id) {
                if (decodeURIComponent(location.hash.slice(1)) === id) {
                    this.route();
                } else {
                    location.hash = encodeURIComponent(id);
                }
            }

            goIndex() {
                this.flushSave();
                if (location.hash) {
                    location.hash = '';
                } else {
                    this.showIndex();
                }
            }

            showIndex() {
                this.currentNote = null;
                document.body.dataset.view = 'index';
                document.title = 'AI Notes';
                this.renderIndex();
            }

            showNote(note) {
                this.currentNote = note;
                document.body.dataset.view = 'note';
                document.title = `${note.title} · AI Notes`;
                document.getElementById('noteView').style.setProperty('--c', colorFor(note.id));
                document.getElementById('noteTitleInput').value = note.title;
                document.getElementById('noteEditor').value = note.content;
                document.getElementById('noteScroll').scrollTop = 0;
                this.clearAnswer();
                this.updateMeta();
                this.autosize();

                if (this.focusTitleNext) {
                    this.focusTitleNext = false;
                    const titleInput = document.getElementById('noteTitleInput');
                    titleInput.focus();
                    titleInput.select();
                }
            }

            autosize() {
                const editor = document.getElementById('noteEditor');
                if (document.body.dataset.view !== 'note') return;
                editor.style.height = 'auto';
                editor.style.height = `${editor.scrollHeight}px`;
            }

            loadNotes() {
                try {
                    const notes = localStorage.getItem('ai-notes');
                    return notes ? JSON.parse(notes) : [];
                } catch (error) {
                    console.error('Error loading notes:', error);
                    return [];
                }
            }

            saveNotes() {
                try {
                    localStorage.setItem('ai-notes', JSON.stringify(this.notes));
                } catch (error) {
                    console.error('Error saving notes:', error);
                    this.showToast('Couldn’t save. Your browser storage may be full.', 'error');
                }
            }

            createNewNote() {
                this.flushSave();
                const newNote = {
                    id: Date.now().toString(),
                    title: 'Untitled note',
                    content: '',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                this.notes.unshift(newNote);
                this.saveNotes();
                this.focusTitleNext = true;
                this.openNote(newNote.id);
            }

            updateMeta() {
                if (!this.currentNote) return;
                const text = document.getElementById('noteEditor').value.trim();
                const words = text ? text.split(/\s+/).length : 0;
                document.getElementById('docMeta').textContent =
                    `${this.formatEdited(this.currentNote.updatedAt)} · ${words} ${words === 1 ? 'word' : 'words'}`;
            }

            saveCurrentNote(silent = false) {
                if (!this.currentNote) return;
                clearTimeout(this.autoSaveTimeout);
                this.autoSaveTimeout = null;

                this.currentNote.title = document.getElementById('noteTitleInput').value.trim() || 'Untitled note';
                this.currentNote.content = document.getElementById('noteEditor').value;
                this.currentNote.updatedAt = new Date().toISOString();

                this.saveNotes();
                this.updateMeta();
                document.title = `${this.currentNote.title} · AI Notes`;
                if (!silent) this.showToast('Saved');
            }

            autoSave() {
                if (this.currentNote) {
                    clearTimeout(this.autoSaveTimeout);
                    this.autoSaveTimeout = setTimeout(() => this.saveCurrentNote(true), 1000);
                }
            }

            flushSave() {
                if (this.autoSaveTimeout && this.currentNote) {
                    this.saveCurrentNote(true);
                }
            }

            deleteCurrentNote() {
                if (!this.currentNote) return;

                if (confirm('Delete this note? This can’t be undone.')) {
                    clearTimeout(this.autoSaveTimeout);
                    this.autoSaveTimeout = null;
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.saveNotes();
                    this.currentNote = null;
                    this.goIndex();
                    this.showToast('Note deleted');
                }
            }

            renderIndex() {
                const list = document.getElementById('notesList');
                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                const notes = query
                    ? this.notes.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query))
                    : this.notes;

                const count = this.notes.length;
                document.getElementById('noteCount').textContent = `${count} ${count === 1 ? 'note' : 'notes'}`;

                if (notes.length === 0) {
                    list.innerHTML = `<p class="index-empty">${query ? 'No matches' : 'No notes yet'}</p>`;
                    return;
                }

                list.innerHTML = notes.map((note, i) => `
                    <button type="button" class="row" data-id="${this.escapeHtml(note.id)}"
                            style="--c: ${colorFor(note.id)}; animation-delay: ${Math.min(i, 8) * 40}ms">
                        <span class="row-title">${this.escapeHtml(note.title)}</span>
                        <span class="row-note"><span class="sq"></span>${this.formatShort(note.updatedAt)}</span>
                    </button>`).join('');
            }

            async checkAIConnection() {
                try {
                    const response = await fetch('http://localhost:11434/api/tags');
                    if (response.ok) {
                        const data = await response.json();
                        const hasDeepSeek = data.models?.some(model =>
                            model.name.includes('deepseek-r1:1.5b')
                        );

                        this.isAIConnected = hasDeepSeek;
                        this.updateAIStatus(hasDeepSeek);
                    } else {
                        this.updateAIStatus(false);
                    }
                } catch (error) {
                    this.isAIConnected = false;
                    this.updateAIStatus(false);
                }
            }

            updateAIStatus(connected) {
                document.getElementById('aiDock').classList.toggle('offline', !connected);
                document.getElementById('aiDockLabel').textContent = connected
                    ? 'Ask DeepSeek R1 to'
                    : 'AI offline. Start Ollama, then reload.';
                document.querySelectorAll('.chip').forEach(chip => {
                    chip.setAttribute('aria-disabled', String(!connected));
                });
            }

            clearAnswer() {
                document.getElementById('aiDock').classList.remove('has-answer');
                document.getElementById('aiResponse').textContent = '';
            }

            async processAIRequest(action, chip) {
                if (!this.isAIConnected) {
                    this.showToast('AI is offline. Start Ollama with deepseek-r1:1.5b, then reload.', 'error');
                    return;
                }

                const content = document.getElementById('noteEditor').value;
                if (!content.trim()) {
                    this.showToast('Write something first, then ask the AI.', 'error');
                    return;
                }

                const dock = document.getElementById('aiDock');
                const aiResponse = document.getElementById('aiResponse');
                document.getElementById('aiAnswerLabel').textContent = ANSWER_LABELS[action] || 'Answer';
                dock.classList.add('has-answer');
                chip.classList.add('running');
                aiResponse.textContent = 'Working on it…';

                try {
                    const prompt = this.generatePrompt(action, content);
                    const response = await this.callOllama(prompt);
                    const answer = (response || '').replace(/<think>[\s\S]*?<\/think>/g, '').trim();
                    aiResponse.textContent = answer || 'The model returned an empty answer. Try again.';
                } catch (error) {
                    console.error('AI request failed:', error);
                    aiResponse.textContent = 'The model didn’t respond. Check that Ollama is running, then try again.';
                    this.showToast('AI request failed', 'error');
                } finally {
                    chip.classList.remove('running');
                }
            }

            generatePrompt(action, content) {
                const prompts = {
                    summarize: `Please provide a concise summary of the following text:\n\n${content}`,
                    improve: `Please improve the writing quality, clarity, and flow of this text while maintaining its original meaning:\n\n${content}`,
                    expand: `Please expand on the ideas in this text, adding more details, examples, and insights:\n\n${content}`,
                    questions: `Based on this text, generate 5 thoughtful questions that could help explore the topic deeper:\n\n${content}`,
                    keywords: `Extract the main keywords and key concepts from this text:\n\n${content}`
                };

                return prompts[action] || content;
            }

            async callOllama(prompt) {
                const response = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'deepseek-r1:1.5b',
                        prompt: prompt,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data.response;
            }

            showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.setAttribute('role', 'status');
                const mark = document.createElement('span');
                mark.className = 'sq';
                const text = document.createElement('span');
                text.textContent = message;
                toast.append(mark, text);
                document.body.appendChild(toast);

                setTimeout(() => toast.classList.add('show'), 50);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }

            daysAgo(dateString) {
                const date = new Date(dateString);
                const startOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
                return Math.round((startOf(new Date()) - startOf(date)) / 86400000);
            }

            formatShort(dateString) {
                const days = this.daysAgo(dateString);
                const date = new Date(dateString);
                if (days <= 0) return 'Today';
                if (days === 1) return 'Yesterday';
                if (days < 7) return `${days} days ago`;
                return `${date.getDate()} ${MONTHS[date.getMonth()]}`;
            }

            formatEdited(dateString) {
                const short = this.formatShort(dateString);
                return /^\d+ [A-Z]/.test(short) ? `Edited ${short}` : `Edited ${short.toLowerCase()}`;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        const app = new AINotesApp();
    </script>
</body>
</html>
