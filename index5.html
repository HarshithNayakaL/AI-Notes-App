<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Notes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23F59BC0'/%3E%3Cstop offset='.5' stop-color='%23B79CF7'/%3E%3Cstop offset='1' stop-color='%23F7B267'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Crect x='19' y='14' width='26' height='36' rx='6' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M26 26h12M26 34h8' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            --bg: #ffffff;
            --text: #16131f;
            --text-2: #6b6780;
            --text-3: #a7a3b8;
            --line: #eceaf3;
            --soft: #f5f4f9;
            --card: #ffffff;

            --purple: #b39df5;
            --purple-deep: #8e6cf0;
            --yellow: #f5c34b;
            --pink: #f06ba8;
            --blue: #3fa2f2;
            --orange: #f5a524;
            --green: #2fbf71;

            --tint-lav: #f2edff;
            --tint-lav-line: #e4d9ff;
            --tint-sky: #e9f5ff;
            --tint-sky-line: #cfe7fb;
            --tint-cream: #fff6e2;
            --tint-cream-line: #f6e1b0;
            --tint-pink: #fff0f6;
            --tint-pink-line: #fad2e4;
            --tint-mint: #eafaf2;
            --tint-mint-line: #c6edd8;

            --nav: #1f1452;
            --nav-item: #2f2373;
            --grad: linear-gradient(135deg, #f59bc0 0%, #b79cf7 50%, #f7b267 100%);
            --shadow: 0 1px 2px rgba(22, 19, 31, 0.04), 0 8px 24px rgba(22, 19, 31, 0.06);
        }

        [data-theme="dark"] {
            --bg: #0f0c1b;
            --text: #f3f1fa;
            --text-2: #a9a4be;
            --text-3: #6b6680;
            --line: #262138;
            --soft: #1a1629;
            --card: #171326;

            --tint-lav: #1d1833;
            --tint-lav-line: #2f2753;
            --tint-sky: #13202e;
            --tint-sky-line: #1f364f;
            --tint-cream: #261f12;
            --tint-cream-line: #42361a;
            --tint-pink: #28141f;
            --tint-pink-line: #482236;
            --tint-mint: #12241b;
            --tint-mint-line: #1e3d2d;

            --nav: #2a1d6e;
            --nav-item: #3a2c8a;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font);
            font-size: 15px;
            line-height: 1.45;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea {
            font: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        :focus-visible {
            outline: 2px solid var(--purple-deep);
            outline-offset: 3px;
        }

        svg.i {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* ===== Screens ===== */
        .screen {
            display: none;
            max-width: 1180px;
            margin: 0 auto;
            padding: 28px 32px 150px;
            animation: screenIn 0.3s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes screenIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }

        /* ===== Top bar ===== */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            background: var(--grad);
            color: #fff;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .greeting {
            margin-bottom: 2px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-2);
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .top-title {
            font-size: 17px;
            font-weight: 700;
        }

        .circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1.5px solid var(--line);
            background: var(--card);
            color: var(--text);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
        }

        .circle:hover {
            background: var(--soft);
        }

        .circle:active {
            transform: scale(0.94);
        }

        .circle-dark {
            background: var(--nav);
            border-color: var(--nav);
            color: #fff;
        }

        .circle-dark:hover {
            background: var(--nav-item);
        }

        .circle-danger:hover {
            color: var(--pink);
            border-color: var(--tint-pink-line);
            background: var(--tint-pink);
        }

        [data-theme="dark"] .icon-sun,
        [data-theme="light"] .icon-moon {
            display: none;
        }

        /* ===== Type ===== */
        .h1 {
            font-size: clamp(28px, 3vw, 36px);
            font-weight: 800;
            letter-spacing: -0.025em;
            line-height: 1.15;
        }

        .date-line {
            margin-top: 4px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-2);
        }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .section-head h2 {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .see-all {
            border: 0;
            background: none;
            color: var(--purple-deep);
            font-size: 15px;
            font-weight: 600;
        }

        .count {
            margin-top: 2px;
            font-size: 14px;
            color: var(--text-2);
        }

        .label {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        /* ===== Home ===== */
        .home-grid {
            display: grid;
            grid-template-columns: 440px minmax(0, 1fr);
            gap: 48px;
            align-items: start;
        }

        .hero-cards {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            margin-top: 26px;
        }

        .hero {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-end;
            height: 168px;
            padding: 18px;
            border: 0;
            border-radius: 26px;
            color: #fff;
            text-align: left;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .hero:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(31, 20, 82, 0.16);
        }

        .hero:active {
            transform: scale(0.98);
        }

        .hero-purple {
            background: var(--purple);
        }

        .hero-yellow {
            background: var(--yellow);
        }

        .hero-plus {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.28);
            display: grid;
            place-items: center;
        }

        .hero-small {
            position: relative;
            font-size: 15px;
            font-weight: 500;
            opacity: 0.9;
        }

        .hero-big {
            position: relative;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .hero-deco {
            position: absolute;
            right: -6px;
            bottom: -4px;
            width: 104px;
            height: 104px;
            opacity: 0.32;
            pointer-events: none;
        }

        .status-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
            padding: 18px 20px;
            border-radius: 22px;
            background: var(--soft);
        }

        .status-card strong {
            display: block;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .status-card span.sub {
            font-size: 14px;
            color: var(--text-2);
        }

        .status-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        .bar {
            width: 110px;
            height: 14px;
            border-radius: 8px;
            background: var(--card);
            overflow: hidden;
        }

        .bar i {
            display: block;
            height: 100%;
            width: 45%;
            border-radius: 8px;
            background:
                repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.3) 0 5px, transparent 5px 10px),
                linear-gradient(90deg, #b79cf7, #f7b267);
            transition: width 0.6s ease;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .status-card.ready .bar i {
            width: 100%;
            animation: none;
        }

        .status-card.offline .bar i {
            width: 100%;
            animation: none;
            background:
                repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.5) 0 5px, transparent 5px 10px),
                linear-gradient(90deg, #d9d5e5, #e6e2ef);
        }

        [data-theme="dark"] .status-card.offline .bar i {
            background:
                repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.06) 0 5px, transparent 5px 10px),
                linear-gradient(90deg, #2c2640, #342d4a);
        }

        @keyframes pulse {
            50% { opacity: 0.55; }
        }

        .status-text {
            font-size: 15px;
            font-weight: 600;
        }

        .home-side .note-list {
            margin-top: 16px;
        }

        /* ===== Browse ===== */
        .browse {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 104px));
            gap: 14px;
            margin-bottom: 34px;
        }

        .browse-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 0;
            background: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-2);
        }

        .browse-tile {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            border: 2px solid transparent;
            transition: border-color 0.15s, transform 0.1s;
        }

        .browse-tile svg.i {
            width: 28px;
            height: 28px;
            fill: currentColor;
            fill-opacity: 0.22;
        }

        .browse-btn:active .browse-tile {
            transform: scale(0.95);
        }

        .browse-btn.active {
            color: var(--text);
            font-weight: 700;
        }

        .browse-btn.active .browse-tile {
            border-color: currentColor;
        }

        .b-all .browse-tile { background: var(--tint-lav); color: var(--purple-deep); }
        .b-today .browse-tile { background: var(--tint-cream); color: var(--orange); }
        .b-week .browse-tile { background: var(--tint-sky); color: var(--blue); }
        .b-older .browse-tile { background: var(--tint-pink); color: var(--pink); }

        .search-row {
            display: none;
            margin: 18px 0 4px;
        }

        .search-row.show {
            display: block;
        }

        .search-field {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 52px;
            padding: 0 18px;
            border-radius: 18px;
            background: var(--soft);
            color: var(--text-2);
        }

        .search-field input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 15px;
        }

        .search-field input::placeholder {
            color: var(--text-3);
        }

        .search-field:focus-within {
            box-shadow: 0 0 0 2px var(--purple);
        }

        /* ===== Note cards ===== */
        .note-list {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 14px;
            margin-top: 18px;
        }

        .notes-grid {
            grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
        }

        .note-card {
            display: block;
            width: 100%;
            min-width: 0;
            text-align: left;
            padding: 18px 18px 16px;
            border-radius: 24px;
            background: var(--t);
            border: 1.5px solid var(--tl);
            color: var(--text);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            animation: screenIn 0.35s ease both;
        }

        .note-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .note-card:active {
            transform: scale(0.99);
        }

        .t-lav { --t: var(--tint-lav); --tl: var(--tint-lav-line); --ac: #a88bf4; --ac2: #f06ba8; }
        .t-sky { --t: var(--tint-sky); --tl: var(--tint-sky-line); --ac: #3fa2f2; --ac2: #f06ba8; }
        .t-cream { --t: var(--tint-cream); --tl: var(--tint-cream-line); --ac: #e9a93a; --ac2: #a88bf4; }
        .t-pink { --t: var(--tint-pink); --tl: var(--tint-pink-line); --ac: #f06ba8; --ac2: #a88bf4; }
        .t-mint { --t: var(--tint-mint); --tl: var(--tint-mint-line); --ac: #2fbf71; --ac2: #f06ba8; }

        .note-card h3 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.015em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-card p {
            margin-top: 6px;
            font-size: 14px;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 16px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 26px;
            padding: 0 10px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 600;
            color: #fff;
            background: var(--ac, var(--purple-deep));
        }

        .tag svg.i {
            width: 13px;
            height: 13px;
            stroke-width: 2.4;
        }

        .tag-2 {
            background: var(--ac2, var(--pink));
        }

        .empty {
            padding: 28px 22px;
            border-radius: 24px;
            border: 1.5px dashed var(--line);
            color: var(--text-2);
            font-size: 15px;
            text-align: center;
        }

        .empty strong {
            display: block;
            margin-bottom: 4px;
            color: var(--text);
            font-size: 16px;
        }

        .fab {
            position: fixed;
            right: max(24px, calc((100vw - 1180px) / 2 + 32px));
            bottom: 112px;
            z-index: 25;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 0;
            background: linear-gradient(135deg, #c9b5ff, #a98cf5);
            color: #fff;
            display: grid;
            place-items: center;
            box-shadow: 0 10px 24px rgba(142, 108, 240, 0.4);
            transition: transform 0.15s;
        }

        .fab:hover {
            transform: translateY(-2px);
        }

        .fab svg.i {
            width: 24px;
            height: 24px;
        }

        /* ===== Editor ===== */
        .editor-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 36px;
            align-items: start;
        }

        .editor-title {
            display: block;
            width: 100%;
            margin: 14px 0 18px;
            border: 0;
            outline: none;
            background: transparent;
            font-size: clamp(28px, 3vw, 36px);
            font-weight: 800;
            letter-spacing: -0.025em;
            line-height: 1.15;
        }

        .editor-title::placeholder,
        .editor-text::placeholder {
            color: var(--text-3);
        }

        .editor-card {
            padding: 22px 24px;
            border-radius: 26px;
            background: var(--t);
            border: 1.5px solid var(--tl);
        }

        .editor-text {
            display: block;
            width: 100%;
            min-height: 46vh;
            overflow: hidden;
            border: 0;
            outline: none;
            resize: none;
            background: transparent;
            font-size: 17px;
            line-height: 1.75;
        }

        .editor-title:focus-visible,
        .editor-text:focus-visible {
            outline: none;
        }

        .ai-side {
            position: sticky;
            top: 28px;
        }

        .ai-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .ai-head h2 {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .ai-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: var(--soft);
            color: var(--text-2);
        }

        .ai-pill::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-3);
        }

        .ai-pill.ready {
            background: var(--tint-mint);
            color: var(--green);
        }

        .ai-pill.ready::before {
            background: var(--green);
        }

        .ai-pill.offline {
            background: var(--tint-pink);
            color: var(--pink);
        }

        .ai-pill.offline::before {
            background: var(--pink);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            min-height: 104px;
            padding: 16px;
            border: 0;
            border-radius: 22px;
            background: var(--soft);
            color: var(--text);
            text-align: left;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.1s, box-shadow 0.15s;
        }

        .action:hover {
            box-shadow: var(--shadow);
        }

        .action:active {
            transform: scale(0.97);
        }

        .action svg.i {
            width: 28px;
            height: 28px;
            fill: currentColor;
            fill-opacity: 0.22;
            color: var(--ic);
        }

        .action.running {
            box-shadow: 0 0 0 2px var(--ic);
        }

        .action:nth-child(1) { --ic: var(--purple-deep); }
        .action:nth-child(2) { --ic: var(--pink); }
        .action:nth-child(3) { --ic: var(--blue); }
        .action:nth-child(4) { --ic: var(--orange); }
        .action:nth-child(5) { --ic: var(--green); }

        .ai-hint {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-2);
        }

        .answer {
            display: none;
            margin-top: 14px;
            padding: 16px 18px 18px;
            border-radius: 22px;
            background: var(--card);
            border: 1.5px solid var(--line);
            box-shadow: var(--shadow);
        }

        .answer.show {
            display: block;
            animation: screenIn 0.3s ease;
        }

        .answer-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: 700;
        }

        .answer-head .spark {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--grad);
            color: #fff;
            display: grid;
            place-items: center;
        }

        .answer-head .spark svg.i {
            width: 15px;
            height: 15px;
        }

        .answer-head .x {
            margin-left: auto;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 0;
            background: var(--soft);
            color: var(--text-2);
            display: grid;
            place-items: center;
        }

        .answer-head .x svg.i {
            width: 16px;
            height: 16px;
        }

        .answer-text {
            max-height: 46vh;
            overflow-y: auto;
            font-size: 14.5px;
            line-height: 1.65;
            white-space: pre-wrap;
        }

        /* ===== Bottom nav ===== */
        .nav {
            position: fixed;
            left: 50%;
            bottom: max(20px, env(safe-area-inset-bottom));
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 999px;
            background: var(--nav);
            box-shadow: 0 14px 34px rgba(31, 20, 82, 0.35);
            transform: translateX(-50%);
        }

        body[data-view="editor"] .nav,

        .toast {
            position: fixed;

            max-width: min(380px, calc(100vw - 40px));

        @media (hover: none) {

        @media (prefers-reduced-motion: reduce) {

    <script>
        const TINTS = ['lav', 'sky', 'cream', 'pink', 'mint'];
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const ANSWER_LABELS = {
            summarize: 'Summary',
            improve: 'Improved writing',
            expand: 'Expanded ideas',
            questions: 'Questions to explore',
            keywords: 'Keywords'
        };
        const FILTER_TITLES = { all: 'All Notes', today: 'Today', week: 'This Week', older: 'Older' };

        function tintFor(id) {
            let h = 0;
            for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
            return TINTS[h % TINTS.length];
        }

        function icon(name) {
            return `<svg class="i"><use href="#i-${name}"/></svg>`;
        }

        class AINotesApp {
            constructor() {
                this.notes = this.loadNotes();
                this.currentNote = null;
                this.isAIConnected = false;
                this.filter = 'all';
                this.theme = this.loadTheme();
                this.init();
            }

            init() {
                this.applyTheme();

                if (this.notes.length === 0) {
                    this.notes = [{
                        id: '1',
                        title: 'Ferrari',
                        content: `Ferrari, the iconic Italian sports car manufacturer, is synonymous with luxury, speed, and racing heritage. Founded by Enzo Ferrari in 1939, the company initially focused on racing before expanding into the production of high-performance road cars. Ferrari's history is deeply intertwined with Formula 1, where Scuderia Ferrari is the most successful team, boasting numerous championships and a passionate fanbase. Beyond racing, Ferrari cars are known for their distinctive design, advanced technology, and the emotional connection they evoke. Each Ferrari represents a blend of artistry and engineering, making them coveted symbols of automotive excellence and a source of enduring fascination.`,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    }];
                    this.saveNotes();
                }

                this.bindEvents();
                this.checkAIConnection();
                this.route();
            }

            /* ---------- Storage & theme ---------- */

            loadTheme() {
                return localStorage.getItem('ai-notes-theme') || 'light';
            }

            applyTheme() {
                document.body.setAttribute('data-theme', this.theme);
            }

            toggleTheme() {
                this.theme = this.theme === 'light' ? 'dark' : 'light';
                this.applyTheme();
                localStorage.setItem('ai-notes-theme', this.theme);
            }

            loadNotes() {
                try {
                    const notes = localStorage.getItem('ai-notes');
                    return notes ? JSON.parse(notes) : [];
                } catch (error) {
                    console.error('Error loading notes:', error);
                    return [];
                }
            }

            saveNotes() {
                try {
                    localStorage.setItem('ai-notes', JSON.stringify(this.notes));
                } catch (error) {
                    console.error('Error saving notes:', error);
                    this.showToast('Couldn’t save. Your browser storage may be full.', 'error');
                }
            }

            sortedNotes() {
                return [...this.notes].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
            }

            /* ---------- Events ---------- */

            bindEvents() {
                window.addEventListener('hashchange', () => {
                    this.flushSave();
                    this.route();
                });

                document.addEventListener('click', (e) => {
                    const actionEl = e.target.closest('[data-action]');
                    if (actionEl) {
                        this.handleAction(actionEl.dataset.action);
                        return;
                    }
                    const tab = e.target.closest('[data-tab]');
                    if (tab) {
                        this.go(tab.dataset.tab === 'notes' ? '#/notes' : '#/');
                        return;
                    }
                    const card = e.target.closest('.note-card');
                    if (card) {
                        this.go(`#/note/${encodeURIComponent(card.dataset.id)}`);
                        return;
                    }
                    const filterBtn = e.target.closest('[data-filter]');
                    if (filterBtn) {
                        this.filter = filterBtn.dataset.filter;
                        this.renderNotes();
                        return;
                    }
                    const ai = e.target.closest('[data-ai]');
                    if (ai) this.processAIRequest(ai.dataset.ai, ai);
                });

                document.getElementById('searchInput').addEventListener('input', () => this.renderNotes());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveCurrentNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteCurrentNote());
                document.getElementById('answerClose').addEventListener('click', () => this.clearAnswer());

                document.getElementById('noteEditor').addEventListener('input', () => {
                    this.autosize();
                    this.renderEditorTags();
                    this.autoSave();
                });
                document.getElementById('noteTitleInput').addEventListener('input', () => this.autoSave());
                window.addEventListener('resize', () => this.autosize());

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && document.body.dataset.view === 'editor') {
                        this.goBack();
                        return;
                    }
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key) {
                            case 's':
                                e.preventDefault();
                                this.saveCurrentNote();
                                break;
                            case 'n':
                                e.preventDefault();
                                this.createNewNote();
                                break;
                            case 'd':
                                e.preventDefault();
                                this.toggleTheme();
                                break;
                        }
                    }
                });
            }

            handleAction(action) {
                switch (action) {
                    case 'new': this.createNewNote(); break;
                    case 'theme': this.toggleTheme(); break;
                    case 'search': this.openSearch(); break;
                    case 'go-notes': this.go('#/notes'); break;
                    case 'back': this.goBack(); break;
                    case 'ask-last': this.askAboutLastNote(); break;
                }
            }

            /* ---------- Routing ---------- */

            go(hash) {
                if (location.hash === hash || (hash === '#/' && !location.hash)) {
                    this.route();
                } else {
                    location.hash = hash;
                }
            }

            goBack() {
                this.flushSave();
                this.go(this.cameFromNotes ? '#/notes' : '#/');
            }

            route() {
                const hash = location.hash;
                const noteMatch = hash.match(/^#\/note\/(.+)$/);

                if (noteMatch) {
                    const note = this.notes.find(n => n.id === decodeURIComponent(noteMatch[1]));
                    if (note) {
                        const from = document.body.dataset.view;
                        if (from !== 'editor') this.cameFromNotes = from === 'notes';
                        this.showScreen('editor');
                        this.openEditor(note);
                        return;
                    }
                }

                this.currentNote = null;
                if (hash === '#/notes') {
                    this.showScreen('notes');
                    this.renderNotes();
                } else {
                    this.showScreen('home');
                    this.renderHome();
                }
            }

            showScreen(view) {
                document.body.dataset.view = view;
                document.querySelectorAll('.screen').forEach(s => {
                    s.classList.toggle('active', s.id === `screen-${view}`);
                });
                document.querySelectorAll('.nav-btn[data-tab]').forEach(b => {
                    b.classList.toggle('active', b.dataset.tab === view);
                });
                window.scrollTo(0, 0);
            }

            /* ---------- Home ---------- */

            renderHome() {
                const now = new Date();
                const hour = now.getHours();
                const part = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
                document.getElementById('greeting').textContent = `${part} 👋`;
                document.getElementById('todayLine').textContent =
                    `Today ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

                const notes = this.sortedNotes();
                document.getElementById('homeCount').textContent = this.countLabel(notes.length);
                const list = document.getElementById('recentList');
                list.innerHTML = notes.length
                    ? notes.slice(0, 4).map(n => this.cardHTML(n)).join('')
                    : '<div class="empty"><strong>No notes yet</strong>Tap Create New Note to write your first one.</div>';
            }

            askAboutLastNote() {
                const last = this.sortedNotes()[0];
                if (!last) {
                    this.createNewNote();
                    return;
                }
                this.focusAINext = true;
                this.go(`#/note/${encodeURIComponent(last.id)}`);
            }

            /* ---------- Notes list ---------- */

            openSearch() {
                if (document.body.dataset.view !== 'notes') this.go('#/notes');
                requestAnimationFrame(() => {
                    document.getElementById('searchRow').classList.add('show');
                    document.getElementById('searchInput').focus();
                });
            }

            daysAgo(dateString) {
                const date = new Date(dateString);
                const startOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
                return Math.round((startOf(new Date()) - startOf(date)) / 86400000);
            }

            renderNotes() {
                document.querySelectorAll('[data-filter]').forEach(b => {
                    b.classList.toggle('active', b.dataset.filter === this.filter);
                });
                document.getElementById('listTitle').textContent = FILTER_TITLES[this.filter];

                const query = document.getElementById('searchInput').value.trim().toLowerCase();
                const notes = this.sortedNotes().filter(note => {
                    const days = this.daysAgo(note.updatedAt);
                    if (this.filter === 'today' && days > 0) return false;
                    if (this.filter === 'week' && days > 6) return false;
                    if (this.filter === 'older' && days <= 6) return false;
                    if (query && !note.title.toLowerCase().includes(query) && !note.content.toLowerCase().includes(query)) return false;
                    return true;
                });

                document.getElementById('notesCount').textContent = this.countLabel(notes.length);
                const list = document.getElementById('notesList');

                if (notes.length === 0) {
                    const msg = query
                        ? `<strong>No matches</strong>Nothing in ${FILTER_TITLES[this.filter].toLowerCase()} mentions “${this.escapeHtml(query)}”.`
                        : this.filter === 'all'
                            ? '<strong>No notes yet</strong>Tap the note button to write your first one.'
                            : `<strong>Nothing here</strong>No notes were edited ${this.filter === 'older' ? 'more than a week ago' : this.filter === 'today' ? 'today' : 'this week'}.`;
                    list.innerHTML = `<div class="empty">${msg}</div>`;
                    return;
                }

                list.innerHTML = notes.map((n, i) => this.cardHTML(n, i)).join('');
            }

            countLabel(n) {
                return `${n} ${n === 1 ? 'Note' : 'Notes'}`;
            }

            wordCount(text) {
                const t = text.trim();
                return t ? t.split(/\s+/).length : 0;
            }

            shortDate(dateString) {
                const d = new Date(dateString);
                return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`;
            }

            cardHTML(note, i = 0) {
                const words = this.wordCount(note.content);
                const preview = note.content.trim() ? note.content.trim().slice(0, 140) : 'Empty note';
                return `
                    <button type="button" class="note-card t-${tintFor(note.id)}" data-id="${this.escapeHtml(note.id)}"
                            style="animation-delay:${Math.min(i, 8) * 30}ms">
                        <h3>${this.escapeHtml(note.title)}</h3>
                        <p>${this.escapeHtml(preview)}</p>
                        <span class="tags">
                            <span class="tag">${icon('cal')}${this.shortDate(note.updatedAt)}</span>
                            <span class="tag tag-2">${icon('text')}${words} ${words === 1 ? 'word' : 'words'}</span>
                        </span>
                    </button>`;
            }

            /* ---------- Editor ---------- */

            openEditor(note) {
                this.currentNote = note;
                document.getElementById('editorGrid').className = `editor-grid t-${tintFor(note.id)}`;
                document.getElementById('noteTitleInput').value = note.title;
                document.getElementById('noteEditor').value = note.content;
                this.clearAnswer();
                this.renderEditorTags();
                this.autosize();

                if (this.focusTitleNext) {
                    this.focusTitleNext = false;
                    const t = document.getElementById('noteTitleInput');
                    t.focus();
                    t.select();
                }
                if (this.focusAINext) {
                    this.focusAINext = false;
                    document.getElementById('aiSide').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    document.querySelector('.action').focus({ preventScroll: true });
                }
            }

            renderEditorTags() {
                if (!this.currentNote) return;
                const words = this.wordCount(document.getElementById('noteEditor').value);
                document.getElementById('editorTags').innerHTML =
                    `<span class="tag">${icon('cal')}${this.shortDate(this.currentNote.updatedAt)}</span>` +
                    `<span class="tag tag-2">${icon('text')}${words} ${words === 1 ? 'word' : 'words'}</span>`;
            }

            autosize() {
                if (document.body.dataset.view !== 'editor') return;
                const editor = document.getElementById('noteEditor');
                editor.style.height = 'auto';
                editor.style.height = `${editor.scrollHeight}px`;
            }

            createNewNote() {
                this.flushSave();
                const newNote = {
                    id: Date.now().toString(),
                    title: 'Untitled note',
                    content: '',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                this.notes.unshift(newNote);
                this.saveNotes();
                this.focusTitleNext = true;
                this.go(`#/note/${encodeURIComponent(newNote.id)}`);
            }

            saveCurrentNote(silent = false) {
                if (!this.currentNote) return;
                clearTimeout(this.autoSaveTimeout);
                this.autoSaveTimeout = null;

                this.currentNote.title = document.getElementById('noteTitleInput').value.trim() || 'Untitled note';
                this.currentNote.content = document.getElementById('noteEditor').value;
                this.currentNote.updatedAt = new Date().toISOString();
                this.saveNotes();
                this.renderEditorTags();
                if (!silent) this.showToast('Note saved');
            }

            autoSave() {
                if (!this.currentNote) return;
                clearTimeout(this.autoSaveTimeout);
                this.autoSaveTimeout = setTimeout(() => this.saveCurrentNote(true), 1000);
            }

            flushSave() {
                if (this.autoSaveTimeout && this.currentNote) this.saveCurrentNote(true);
            }

            deleteCurrentNote() {
                if (!this.currentNote) return;
                if (!confirm('Delete this note? This can’t be undone.')) return;

                clearTimeout(this.autoSaveTimeout);
                this.autoSaveTimeout = null;
                this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                this.saveNotes();
                this.currentNote = null;
                this.go(this.cameFromNotes ? '#/notes' : '#/');
                this.showToast('Note deleted');
            }

            /* ---------- AI ---------- */

            async checkAIConnection() {
                try {
                    const response = await fetch('http://localhost:11434/api/tags');
                    if (response.ok) {
                        const data = await response.json();
                        const hasDeepSeek = data.models?.some(model => model.name.includes('deepseek-r1:1.5b'));
                        this.isAIConnected = hasDeepSeek;
                        this.updateAIStatus(hasDeepSeek);
                    } else {
                        this.updateAIStatus(false);
                    }
                } catch (error) {
                    this.isAIConnected = false;
                    this.updateAIStatus(false);
                }
            }

            updateAIStatus(connected) {
                const card = document.getElementById('statusCard');
                card.classList.toggle('ready', connected);
                card.classList.toggle('offline', !connected);
                document.getElementById('statusText').textContent = connected ? 'Ready' : 'Offline';

                const pill = document.getElementById('aiPill');
                pill.className = `ai-pill ${connected ? 'ready' : 'offline'}`;
                pill.textContent = connected ? 'Ready' : 'Offline';

                document.getElementById('aiHint').textContent = connected
                    ? 'Runs on your machine with DeepSeek R1.'
                    : 'Start Ollama with deepseek-r1:1.5b, then reload to use these.';
            }

            clearAnswer() {
                document.getElementById('answer').classList.remove('show');
                document.getElementById('aiResponse').textContent = '';
            }

            async processAIRequest(action, tile) {
                if (!this.isAIConnected) {
                    this.showToast('AI is offline. Start Ollama, then reload.', 'error');
                    return;
                }

                const content = document.getElementById('noteEditor').value;
                if (!content.trim()) {
                    this.showToast('Write something first, then ask the AI.', 'error');
                    return;
                }

                const answer = document.getElementById('answer');
                const aiResponse = document.getElementById('aiResponse');
                document.getElementById('answerLabel').textContent = ANSWER_LABELS[action] || 'Answer';
                answer.classList.add('show');
                tile.classList.add('running');
                aiResponse.textContent = 'Working on it…';

                try {
                    const prompt = this.generatePrompt(action, content);
                    const response = await this.callOllama(prompt);
                    const text = (response || '').replace(/<think>[\s\S]*?<\/think>/g, '').trim();
                    aiResponse.textContent = text || 'The model returned an empty answer. Try again.';
                } catch (error) {
                    console.error('AI request failed:', error);
                    aiResponse.textContent = 'The model didn’t respond. Check that Ollama is running, then try again.';
                    this.showToast('AI request failed', 'error');
                } finally {
                    tile.classList.remove('running');
                }
            }

            generatePrompt(action, content) {
                const prompts = {
                    summarize: `Please provide a concise summary of the following text:\n\n${content}`,
                    improve: `Please improve the writing quality, clarity, and flow of this text while maintaining its original meaning:\n\n${content}`,
                    expand: `Please expand on the ideas in this text, adding more details, examples, and insights:\n\n${content}`,
                    questions: `Based on this text, generate 5 thoughtful questions that could help explore the topic deeper:\n\n${content}`,
                    keywords: `Extract the main keywords and key concepts from this text:\n\n${content}`
                };
                return prompts[action] || content;
            }

            async callOllama(prompt) {
                const response = await fetch('http://localhost:11434/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'deepseek-r1:1.5b',
                        prompt: prompt,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data.response;
            }

            /* ---------- Helpers ---------- */

            showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.setAttribute('role', 'status');
                toast.textContent = message;
                document.body.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('show'));
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 2600);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        const app = new AINotesApp();
    </script>
</body>
</html>
